<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minuto91</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>:root{--fondo:#F4F4F1;--tinta:#12140F;--tenue:#5F665C;--linea:#E3E4DD;--enlace:#5C7A11;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--fondo:#080A08;--tinta:#E9EEE5;--tenue:#A3AA9E;--linea:#252923;--enlace:#C6FF3D;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.marco{max-width:680px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--linea)}
header .marco{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:9px;color:var(--tinta);text-decoration:none;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
nav{display:flex;gap:16px;font-size:15px}
nav a{color:var(--tenue);text-decoration:none}
nav a[aria-current]{color:var(--tinta);font-weight:600}
main{padding-top:28px;padding-bottom:40px}
h1{font-size:30px;line-height:1.2;margin:0 0 6px}
h2{font-size:21px;line-height:1.3;margin:34px 0 8px}
h3{font-size:17px;margin:24px 0 4px}
p,ul,ol{margin:0 0 14px}
ul,ol{padding-left:22px}
li{margin-bottom:6px}
a{color:var(--enlace);text-underline-offset:2px;overflow-wrap:anywhere}
code{font-size:.92em}
footer{border-top:1px solid var(--linea);color:var(--tenue);font-size:14px}
footer .marco{padding-top:16px;padding-bottom:28px}</style>
</head>
<body>
<header><div class="marco"><a class="marca" href="/"><svg width="26" height="26" viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="28" r="13" stroke="currentColor" stroke-width="5"/><path d="M15.96 8.6A21 21 0 0 1 43.4 19.96" stroke="#C6FF3D" stroke-width="5" stroke-linecap="round"/></svg><span>Minuto91</span></a><nav><a href="/privacidad/">Privacidad</a><a href="/terminos/">Términos</a><a href="/soporte/">Soporte</a></nav></div></header>
<main class="marco">
<h1>Esta página no existe</h1>
<p><a href="/">Volver al inicio</a></p>
</main>
<footer><div class="marco">Esta página no usa cookies ni medición. La aloja GitHub Pages.</div></footer>
</body>
</html>
